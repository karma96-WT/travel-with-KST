name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./travel_with_kst # Set to your Next.js subfolder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          // cache: 'npm'
          cache-dependency-path: 'travel_with_kst/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting/linting
        run: npm run lint --if-present

      - name: Run automated tests
        run: npm test --if-present

      - name: Build project
        run: npm run build
