name: Build, scan, and deploy container

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build and smoke-test static export
        run: pnpm build && pnpm test

  docker-build-check:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: travel-with-kst:pull-request-check
          build-args: |
            NEXT_PUBLIC_BASE_PATH=
          cache-from: type=gha,scope=pr
          cache-to: type=gha,mode=max,scope=pr

  publish-image:
    needs: [verify, docker-build-check]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate Docker Hub credentials
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::Add the DOCKERHUB_USERNAME repository variable."
            exit 1
          fi
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Add the DOCKERHUB_TOKEN repository secret with Read & Write access."
            exit 1
          fi

      - name: Set lowercase image name
        id: image
        shell: bash
        run: echo "name=docker.io/${DOCKERHUB_USERNAME,,}/travel-with-kst" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_BASE_PATH=
          cache-from: type=gha,scope=main
          cache-to: type=gha,mode=max,scope=main
          sbom: true
          provenance: true

  scan-image:
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.publish-image.outputs.image }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy findings to code scanning
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Promote scanned image to latest
        env:
          IMAGE: ${{ needs.publish-image.outputs.image }}
        run: |
          docker pull "$IMAGE:sha-${GITHUB_SHA}"
          docker tag "$IMAGE:sha-${GITHUB_SHA}" "$IMAGE:latest"
          docker push "$IMAGE:latest"

  deploy-kubernetes:
    needs: [publish-image, scan-image]
    if: github.ref == 'refs/heads/main' && vars.K8S_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate deployment secrets
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::error::Add the KUBE_CONFIG repository secret with the target cluster kubeconfig."
            exit 1
          fi

      - name: Configure cluster access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          umask 077
          printf '%s' "$KUBE_CONFIG" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Apply Kubernetes resources
        run: |
          kubectl apply -f k8s/website/deployment.yaml \
            -f k8s/website/service.yaml \
            -f k8s/website/ingress.yaml

      - name: Update image and wait for rollout
        id: rollout
        env:
          IMAGE: ${{ needs.publish-image.outputs.image }}:sha-${{ github.sha }}
        run: |
          kubectl set image deployment/travel-with-kst \
            website="$IMAGE" \
            --namespace travel-with-kst
          kubectl rollout status deployment/travel-with-kst \
            --namespace travel-with-kst \
            --timeout=240s

      - name: Roll back an unhealthy release
        if: failure() && steps.rollout.outcome == 'failure'
        run: |
          kubectl rollout undo deployment/travel-with-kst --namespace travel-with-kst || true
          kubectl rollout status deployment/travel-with-kst \
            --namespace travel-with-kst \
            --timeout=180s || true
