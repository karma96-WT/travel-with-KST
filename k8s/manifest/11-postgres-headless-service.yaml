# This file defines a headless Service for the PostgreSQL database in the travel-with-kst application.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: travel-with-kst
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
