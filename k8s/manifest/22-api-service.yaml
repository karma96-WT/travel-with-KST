# This file defines a Service for the API in the travel-with-kst application.
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: travel-with-kst
  labels:
    app: api
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
