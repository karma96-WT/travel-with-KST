# This file defines a VerticalPodAutoscaler for the PostgreSQL StatefulSet in the travel-with-kst application. It specifies the target StatefulSet, update policy, and resource policies for the PostgreSQL container, including minimum and maximum allowed CPU and memory resources, as well as controlled resources and values.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: postgres-vpa
  namespace: travel-with-kst
  labels:
    app: postgres
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: postgres
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: postgres
        minAllowed:
          cpu: 50m
          memory: 128Mi
        maxAllowed:
          cpu: 1000m
          memory: 1Gi
        controlledResources:
          - cpu
          - memory
        controlledValues: RequestsAndLimits
